name: "test, compile and deploy"
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --no-default-features
      - run: cargo check --workspace --all-targets --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo clippy --workspace --all-targets --all-features

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --all-features

  build:
      needs: test
      strategy:
        matrix:
          platform:
            - target: x86_64-unknown-linux-gnu
              os: ubuntu-latest
              cross: true
            - target: aarch64-unknown-linux-gnu
              os: ubuntu-latest
              cross: true
            - target: x86_64-apple-darwin
              os: macos-latest
              cross: false
            - target: aarch64-apple-darwin
              os: macos-latest
              cross: false
      runs-on: ${{ matrix.platform.os }}
      steps:
        - uses: actions/checkout@v4

        - name: Set up Rust toolchain
          if: ${{ !matrix.platform.cross }}
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            target: ${{ matrix.platform.target }}

        - name: Cross build (Linux)
          if: ${{ matrix.platform.cross }}
          uses: houseabsolute/actions-rust-cross@v1
          with:
            target: ${{ matrix.platform.target }}
            args: "--locked --release --workspace"
            strip: true

        - name: Native build (macOS)
          if: ${{ !matrix.platform.cross }}
          run: cargo build --locked --release --workspace --target ${{ matrix.platform.target }}

        - name: Package artifact
          shell: bash
          run: |
            mkdir -p staging/ artifacts/
            find target/${{ matrix.platform.target }}/release -maxdepth 1 -type f -perm -u+x -exec cp {} staging/ ';'
            if [ "${{ runner.os }}" = "macOS" ]; then
              find target/${{ matrix.platform.target }}/release/build -path '*/steamworks-sys-*/out/libsteam_api.dylib' -exec cp {} staging/ ';'
            else
              find target/${{ matrix.platform.target }}/release/build -path '*/steamworks-sys-*/out/libsteam_api.so' -exec cp {} staging/ ';'
            fi
            cp contrib/install.sh contrib/steam-broker.service staging/
            pushd staging/
              tar --zstd -cvf ../artifacts/steam-broker-${{ matrix.platform.target }}.tar.zst *
            popd

        - uses: actions/upload-artifact@v4
          with:
            name: artifact-${{ matrix.platform.target }}
            path: artifacts/*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' }}
    steps:
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name == 'master' && 'continuous' || format('continuous-{0}', github.ref_name) }}
      run: |
        gh release delete "$RELEASE_TAG" \
          --yes \
          --cleanup-tag \
          --repo "$GITHUB_REPOSITORY" || true
        sleep 20s
        gh run download "$GITHUB_RUN_ID" \
          --dir artifacts/ \
          --repo "$GITHUB_REPOSITORY"
        pushd artifacts/
        echo "Found artifacts:"
        ls
        for i in $(find -mindepth 1 -maxdepth 1 -type d); do
          mv "$i"/* .
          rm -rf "$i"
        done
        echo "Repackaged artifacts:"
        ls -R
        popd
        sleep 20s
        gh release create "$RELEASE_TAG" artifacts/* \
          --title "steam-broker Continuous ${{ github.ref_name }} Build" \
          --target $GITHUB_SHA \
          --repo "$GITHUB_REPOSITORY" \
          --prerelease
